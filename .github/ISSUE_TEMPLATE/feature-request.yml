name: Feature request
description: Suggest a new capability or a meaningful change to an existing one
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature ideas are welcome. Please describe the problem first — a good
        problem statement often makes the right solution obvious, and keeps the
        discussion from getting locked into one implementation too early.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and where does the current extension get in the way?
      placeholder: |
        When I ..., I want to ..., but today ...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: What would you like the extension to do? UI sketches, keyboard shortcuts, or example workflows all help.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (including workarounds you're using now) and why they aren't enough.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Related issues, prior art in other tools, screenshots, mockups.
    validations:
      required: false
